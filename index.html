<!doctype html>
<!-- Niigata Rice Field Puzzle, GameBull web build. This page is the host-facing shell:
     - the loading page (Unity IdeofuzionBridge template behaviour, playbook section 7): baked blurred backdrop from
       the client's art, spinner, tenant icon from /context (gameLogoUrl, then gameBannerUrl) with the 4 s / 30 s
       clocks, the client's rice mark as the built-in icon;
     - a frame filling the whole page (safe areas excepted) that runs the client's page (app.html) with the same
       launch URL. Their own Stage Mode screens (stage map, 1-life confirm, results, voucher) are the GameBull UI. -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#234d35">
<title>にいがた 田んぼパズル</title>
<link rel="icon" href="assets/rice-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="gb/loader.css">
</head>
<body>
<iframe id="gb-frame" title="にいがた 田んぼパズル" allow="autoplay; fullscreen; clipboard-write"></iframe>
<div id="gb-loading">
  <div id="unity-loading-bar">
    <div id="unity-logo"><div id="gb-tenant-logo"></div><div id="gb-spinner"></div></div>
    <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
    <div id="unity-progress-percent">0%</div>
  </div>
</div>
<script src="gb/env.js"></script>
<script src="gb/nozoom.js"></script>
<script src="gb/loader.js"></script>
</body>
</html>
