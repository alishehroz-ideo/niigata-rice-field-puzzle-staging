<!doctype html>

<html lang="ja">

<meta name="referrer" content="no-referrer"><meta name="theme-color" content="#234d35"><meta name="description" content="にいがたの田んぼをトラクターで耕す、ひと筆パズル。600ステージ・スマートフォン対応。"><link rel="icon" href="assets/rice-mark.svg" type="image/svg+xml"><link rel="stylesheet" href="mobile.css">

<main class="app"><header class="header farm-header"><div class="farm-branding"><p class="farm-origin">魚沼産コシヒカリ・棚田米</p><p class="farm-name">佐藤農場</p><div class="brand"><img src="assets/rice-mark.svg" alt="" width="30" height="38"><h1><span>にいがた</span>田んぼパズル</h1></div></div><div class="header-status"><div class="life-display" aria-label="GameBullのライフ。未接続、テスト中は消費なし"><span class="life-title"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21 3.7 12.8C-1 8.2 5.8 1.3 12 7c6.2-5.7 13 1.2 8.3 5.8Z"/></svg>ライフ <strong id="life-count">—</strong></span><small>テスト中・消費なし</small></div><button id="pause" class="icon-button" aria-label="一時停止"><svg><use href="#pause-icon"/></svg></button></div></header>
